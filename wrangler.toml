name = "pontosemno"
compatibility_date = "2025-09-01"
# As Pages Functions em functions/ são compiladas para .worker/index.js
# pelo comando `npm run build` (wrangler pages functions build).
main = "./.worker/index.js"

# Domínio próprio. A Cloudflare cria os registros DNS sozinha
# porque a zona já está na mesma conta.
routes = [
  { pattern = "crochepontosemno.com", zone_name = "crochepontosemno.com", custom_domain = true },
  { pattern = "www.crochepontosemno.com", zone_name = "crochepontosemno.com", custom_domain = true },
]

[assets]
directory = "./public"

# Variáveis públicas (não secretas). Secrets vão em .dev.vars (local)
# e em Settings > Variables and Secrets no painel do Cloudflare Pages.
[vars]
# URL pública do site. Em branco = usa a origem da requisição (bom para dev local).
SITE_URL = "https://crochepontosemno.com"
# Frete fixo em centavos (2500 = R$ 25,00). AJUSTE antes de publicar.
SHIPPING_FLAT_CENTS = "2500"
# Frete grátis a partir deste subtotal em centavos. Em branco = desativado.
FREE_SHIPPING_MIN_CENTS = ""
# Minutos que uma peça fica reservada enquanto o cliente paga.
RESERVATION_MINUTES = "30"

[[d1_databases]]
binding = "DB"
database_name = "ponto-sem-no"
database_id = "e964d4f3-5c3c-4892-8c4d-fed1ea49f678"
migrations_dir = "migrations"

# Fotos enviadas pelo /admin (o campo `images` da peça guarda "fotos/<key>").
[[kv_namespaces]]
binding = "FOTOS"
id = "632f9e2662a74782b3ddbdd9523d477c"
